[package]
name = "anticater-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Device read/write and vendor HID Protocol for the Anticater Knob"

[dependencies]
# Official HID Usage Tables
hut = "0.5"
# Cross-platform USB HID
## Compiles a small C shim on Windows via the MSVC toolchain.
hidapi = "2"
# Cross-platform GATT (WinRT / CoreBluetooth / BlueZ)
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures = "0.3"
